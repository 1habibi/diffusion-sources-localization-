model_version: v1_baseline
experiment: facebook_joint_without_consistency

data:
  directory: data/generated/facebook_main
  feature_indices: [0, 1]

model:
  input_dim: 2
  hidden_dim: 64
  dropout: 0.2

training:
  seed: 7026
  device: cuda
  learning_rate: 0.001
  batch_size: 3
  resume: true
  max_epochs: 100
  patience: 10

loss:
  lambda_count: 1.0
  lambda_consistency: 0.0
  use_pos_weight: true
