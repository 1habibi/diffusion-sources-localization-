model_version: snapshot_v2
experiment: s1a_local_structural
ablation:
  id: S1a
  parent: S0
  changed_factor: local_structural_features
  purpose: test_snapshot_local_structure_without_architecture_changes

data:
  directory: data/generated/facebook_main
  feature_names:
    - observed_infected
    - log_degree_normalized
    - observed_neighbor_count_normalized
    - observed_neighbor_fraction
    - unobserved_neighbor_count_normalized
    - unobserved_neighbor_fraction
    - closed_neighborhood_observed_fraction

model:
  architecture: v1_joint
  input_dim: 7
  hidden_dim: 64
  dropout: 0.2

training:
  seed: 7026
  device: cuda
  learning_rate: 0.001
  batch_size: 3
  resume: true
  max_epochs: 100
  patience: 10

loss:
  lambda_count: 1.0
  lambda_consistency: 0.0
  use_pos_weight: true

evaluation:
  selection_split: validation
  evaluate_test: false
  test_policy: locked_until_candidate_freeze
  final_holdout_policy: sealed_until_final_freeze
