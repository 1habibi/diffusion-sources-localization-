model_version: v1_baseline
experiment: facebook_resource_profile

data:
  directory: data/generated/facebook_pilot
  feature_indices: [0, 1]
  split_limits:
    train: 18
    validation: 9
    test: 9

model:
  input_dim: 2
  hidden_dim: 16
  dropout: 0.0

training:
  seed: 6026
  device: cpu
  learning_rate: 0.001
  batch_size: 3
  max_epochs: 2
  patience: 2

loss:
  lambda_count: 1.0
  lambda_consistency: 0.1
  use_pos_weight: true
